server:
  port: 8083

spring:
  application:
    name: ms-credit-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/banking}
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.banking.credit: DEBUG

---
# Perfil dev: sin proveedor de identidad, seguridad temporal permitAll (common-rules.md)
spring:
  config:
    activate:
      on-profile: dev
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000}

transaction-service:
  base-url: ${TRANSACTION_SERVICE_URL:http://ms-transaction-service}

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 2s
